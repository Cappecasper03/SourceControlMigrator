[workspace]
resolver = "3"
members = [
    "crates/source-control-migrator-ai",
    "crates/source-control-migrator",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
clap = { version = "*", features = ["derive"] }
gix = { version = "*", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
tokio = { version = "*", features = ["rt-multi-thread"] }
prodash = { version = "*", features = ["progress-tree", "render-line", "render-line-crossterm", "render-line-autoconfigure"] }

lore = { git = "https://github.com/EpicGames/lore", tag = "v0.12.0" }

[patch.crates-io]
quinn-proto = { git = "https://github.com/EpicGames/lore", tag = "v0.12.0" }
glob-match = { git = "https://github.com/EpicGames/lore", tag = "v0.12.0" }